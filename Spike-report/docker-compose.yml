services:

  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: spike_report
      POSTGRES_USER: spike_user
      POSTGRES_PASSWORD: spike_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Файлы выполняются в алфавитном порядке: сначала schema, потом seed
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spike_user -d spike_report"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
