{% extends "base.html" %}

{% block content %}
<article class="contact-form">
    <h2>Обратная связь</h2>
    <p class="form-description">Если у вас есть вопросы или предложения, заполните форму ниже:</p>

    {# Показываем сообщение об успехе если форма была отправлена #}
    {% if sent %}
    <div style="background:#2ecc71; color:white; padding:15px;
                border-radius:6px; margin-bottom:20px;">
        Ваше сообщение отправлено! Спасибо за обратную связь.
    </div>
    {% endif %}

    <form class="feedback-form" method="post" action="/contact">
        <div class="form-group">
            <label for="name">Ваше имя:</label>
            <input type="text" id="name" name="name"
                   required maxlength="150">
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   required maxlength="150">
        </div>

        <div class="form-group">
            <label for="message">Сообщение:</label>
            <textarea id="message" name="message"
                      rows="5" required maxlength="2000"></textarea>
        </div>

        <button type="submit" class="submit-button">Отправить</button>
    </form>
</article>
{% endblock %}
